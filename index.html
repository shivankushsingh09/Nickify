<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nickify | Ultimate Nickname Generator</title>
    <meta name="description" content="Generate cool, funny, and unique nicknames instantly with Nickify.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>

<body class="d-flex flex-column min-vh-100 text-light">

    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <main class="container py-5 flex-grow-1 d-flex flex-column align-items-center justify-content-center">
        <header class="text-center mb-5">
            <h1 class="logo display-3 fw-bold">Nick<span class="highlight">ify</span></h1>
            <p class="tagline fs-5 opacity-75">Level up your identity.</p>
        </header>

        <section class="glass-panel p-4 p-md-5 w-100" style="max-width: 800px;">
            <div class="row g-4 justify-content-center">
                <div class="col-12">
                    <label for="baseName" class="visually-hidden">Enter your name</label>
                    <input type="text" id="baseName"
                        class="form-control form-control-lg bg-transparent text-light custom-input text-center"
                        placeholder="Enter your name or keyword" autocomplete="off">
                </div>

                <div class="col-12 text-center">
                    <div class="d-flex flex-wrap justify-content-center gap-2" id="styleSelector">
                        <button class="btn btn-outline-light rounded-pill px-4 py-2 active"
                            data-style="random">Random</button>
                        <button class="btn btn-outline-light rounded-pill px-4 py-2" data-style="gamer">Gamer</button>
                        <button class="btn btn-outline-light rounded-pill px-4 py-2" data-style="cool">Cool</button>
                        <button class="btn btn-outline-light rounded-pill px-4 py-2" data-style="funny">Funny</button>
                        <button class="btn btn-outline-light rounded-pill px-4 py-2"
                            data-style="aesthetic">Aesthetic</button>
                    </div>
                </div>

                <div class="col-12 text-center mt-3">
                    <button id="generateBtn"
                        class="btn btn-primary btn-lg w-100 rounded-3 py-3 fw-bold text-uppercase tracking-wider">
                        Generate Nicknames
                    </button>
                </div>
            </div>
        </section>

        <section class="results-section mt-5 w-100" style="max-width: 800px;">
            <div id="resultsGrid" class="row g-3">
                <!-- Generated results will appear here -->
                <div class="col-12 text-center text-muted fst-italic py-4">
                    Enter a name and hit generate to start!
                </div>
            </div>
        </section>
    </main>

    <footer class="py-4 text-center text-muted">
        <small>&copy; 2026 Nickify. Built for creators.</small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
